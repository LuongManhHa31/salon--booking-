services:
  - type: web
    name: salon-booking-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        value: "dien_key_cua_ban_khi_cai_dat_render"

databases:
  - name: salon-db
    plan: free
    databaseName: salon
    user: salon_user
