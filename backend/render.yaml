services:
  - type: web
    name: salon-booking-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run prisma:seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true


databases:
  - name: salon-db
    plan: free
    databaseName: salon
    user: salon_user
